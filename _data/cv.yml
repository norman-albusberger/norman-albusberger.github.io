        highlights:
          - Unternehmen von null auf 36 feste Mitarbeitende, über 800 angebundene Freelancer und 5,5 Mio. € Jahresumsatz aufgebaut.
          - Gesamtverantwortung für Unternehmensstrategie, Technologie, Softwarearchitektur und Produktentwicklung.
          - Aufbau von Vertrieb, Business Development und Marketing; volle P&L-Verantwortung als Geschäftsführer.

