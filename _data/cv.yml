        position: Cluster Lead — Delivery- & Budgetverantwortung
        location: Berlin / Remote
        start_date: 2024
        end_date: heute
        summary: >
          Technologische und wirtschaftliche Gesamtverantwortung für eine rund 30-köpfige Delivery-Organisation
          im Umfeld von Daimler Truck.
        highlights:
          - Gesamtverantwortung für ~30 Spezialisten (Java, iOS, Autoline-Modulexperten, Softwareentwicklung, Testautomatisierung/Ranorex); disziplinarische Führung von 12 Mitarbeitenden.
          - Budgetverantwortung bis 1,2 Mio. € inklusive Angebots- und Ausschreibungsmanagement sowie Vertragsgestaltung für Managed-Services-Mandate.
          - Verantwortung für Change- und Release-Management sowie die kontinuierliche Transformation der Delivery-Organisation.
          - Kundenmanagement auf Entscheiderebene und Steuerung der Managed-Services-Leistungserbringung.

      - company: Bundesdruckerei Gruppe
