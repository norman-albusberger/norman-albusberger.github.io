        highlights:
          - Verantwortung für Architektur, technische Roadmap und Qualität der Plattform (Web, iOS, Android).
          - Aufbau und Entwicklung des Engineering-Teams; Einführung agiler Methoden und Rituale.
          - Identifikation und Steuerung technischer Risiken; Optimierung von Prozessen und Time-to-Market.

      - company: Strategische Technologieberatung (u. a. Solfas Technologie GmbH)
