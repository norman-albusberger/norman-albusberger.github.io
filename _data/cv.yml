          Leitung der Transformation auf eine moderne ITSM-Plattform und Modernisierung der zugehörigen
          Service- und Betriebsprozesse in einem regulierten Umfeld.
        highlights:
          - Verantwortung für die Migration auf eine moderne ITSM-Plattform und die Neugestaltung der betroffenen Prozesse.
          - Steuerung von Stakeholdern über Fachbereiche hinweg; Einführung standardisierter, skalierbarer Abläufe.

      - company: Hagebau Gruppe · Digital Seals GmbH (Plattform „Hagedoo")
        position: Technische Gesamtleitung — Head of Engineering
        location: Deutschland
