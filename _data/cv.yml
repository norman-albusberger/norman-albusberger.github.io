        highlights:
          - CEO-Advisory zu Technologiestrategie, Produkt-Portfolio und Digitalisierung.
          - Konzeption und Entwicklung von Steuerungs- und Enterprise-Software für industrielle Test- und Messsysteme.
          - Aufbau agiler Organisationsstrukturen und Begleitung technischer Transformationsvorhaben.

      - company: FLZR GmbH
        position: Gründer, Geschäftsführer & CTO
        location: Deutschland
